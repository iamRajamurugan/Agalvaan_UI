# Rover Hardware & Network Configuration
rover:
  name: "Lunabotics Rover"
  computer: "NVIDIA Jetson Orin Nano"
  os: "Ubuntu 22.04 LTS"
  ros_distro: "Humble"
  ros_domain_id: 0

network:
  rover_ip: "192.168.1.100"
  mission_control_ip: "192.168.1.50"
  heartbeat_port: 8765
  video_rtsp_port: 8554

ros_topics:
  cmd_vel: "/cmd_vel"
  heartbeat: "/rover/heartbeat"
  imu: "/imu/data"
  odometry: "/odom"
  joint_states: "/joint_states"
  lidar_front: "/lidar_front/scan"
  lidar_rear: "/lidar_rear/scan"
  lidar_left: "/lidar_left/scan"
  lidar_right: "/lidar_right/scan"
  camera_image: "/camera/image_raw"
  camera_compressed: "/camera/image_raw/compressed"
  mission_state: "/mission/state"
  diagnostics: "/diagnostics"
  estop: "/safety/estop"

sensors:
  lidar_count: 4
  camera:
    mount: "front"
    aspect_ratio: "16:9"
    target_fps: 30
    resolution:
      width: 1280
      height: 720


# Operator camera feeds shown in the main view (FRONT / REAR selector).
#   type: synthetic  -> built-in test pattern (development)
#         realsense  -> Intel RealSense colour stream (needs: pip install -e ".[realsense]")
#         opencv     -> RTSP URL, video file, or device index via OpenCV (set url)
#         none       -> camera not fitted; the view shows "<NAME> CAMERA OFFLINE"
cameras:
  front:
    type: "realsense"            # Intel RealSense D456 (colour stream only)
    serial: ""                   # Optional device serial; empty = first RealSense found
    width: 1280
    height: 720
    fps: 30
    fallback_to_synthetic: true  # No SDK / no device -> labelled synthetic pattern
  rear:
    type: "none"                 # e.g. "opencv" with url "rtsp://192.168.1.100:8554/rear_camera" or "0"
    url: ""
    width: 1280
    height: 720
    fps: 30
    fallback_to_synthetic: false # Never show a stand-in as if it were the rear camera
